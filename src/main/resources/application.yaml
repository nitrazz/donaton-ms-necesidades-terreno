spring:
  application:
    name: donaton-ms-necesidades
  datasource:
    url: jdbc:postgresql://TU_IP_O_ENDPOINT_AWS:5432/necesidades_db # Reemplaza por tu IP/DNS de AWS
    username: postgres # Tu usuario de BD en AWS
    password: tu_password_aws # Tu contraseña de BD en AWS
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
  rabbitmq:
    host: 3.80.203.201 # IP del servidor RabbitMQ en AWS
    port: 5672
    username: guest
    password: guest

server:
  port: 8083

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

app:
  rabbitmq:
    queues:
      notificaciones: cola.notificaciones